[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-content-production-studio"
version = "0.7.0"
description = "An offline multimodal content workflow with configurable prompts and non-sending provider adapters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.scripts]
aigc-studio = "aigc_content_studio.cli:main"
aigc-assets = "aigc_content_studio.asset_cli:main"
aigc-provider-plan = "aigc_content_studio.provider_cli:main"
aigc-quality = "aigc_content_studio.quality_cli:main"
aigc-route = "aigc_content_studio.routing_cli:main"
aigc-studio-trial = "aigc_content_studio.trial_cli:main"
aigc-provider-diff = "aigc_content_studio.capability_diff_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
