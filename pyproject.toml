[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-content-production-studio"
version = "0.2.0"
description = "An offline, controlled multimodal content-production planning workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.scripts]
aigc-studio = "aigc_content_studio.cli:main"
aigc-assets = "aigc_content_studio.asset_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
